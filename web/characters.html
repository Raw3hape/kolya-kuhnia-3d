<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Десять соседей — Кухня 3D</title>
<script type="importmap">{"imports":{"three":"./vendor/three-0.169/build/three.module.js"}}</script>
<style>
:root{color-scheme:light;--paper:#f4f3ef;--ink:#1c2326;--muted:#66706f;--accent:#0f4352;--line:rgba(28,35,38,.15)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,"Helvetica Neue",Arial,sans-serif}
main{max-width:1500px;margin:0 auto;padding:36px 48px 28px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 9px;color:var(--accent);font:500 11px/1.2 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1.1}header p{max-width:365px;margin:0;color:var(--muted);font-size:13px}
.preview{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:15px 0;border-bottom:1px solid var(--line)}.preview label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.preview select,.preview button{min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);font:500 12px/1.3 inherit;cursor:pointer}.preview select{font-size:14px;background:#fbfaf8}.preview button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.preview button:disabled{opacity:.45;cursor:default}.preview input[type=range]{width:78px;accent-color:var(--accent)}.preview input[type=checkbox]{accent-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#gallery{position:relative;margin-top:10px}#grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:20px;row-gap:12px}article{min-width:0;position:relative;padding-bottom:15px;border-bottom:1px solid var(--line)}.model{height:285px}.label{position:relative;z-index:1;text-align:center;pointer-events:none}.number{margin-right:6px;color:var(--accent);font:11px ui-monospace,monospace}.name{font-size:14px;font-weight:600}.detail{display:block;margin-top:4px;color:var(--muted);font-size:11px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

@media(max-width:800px){main{padding:24px 20px}header{display:block}header p{margin-top:14px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.model{height:260px}h1{font-size:30px}footer{flex-direction:column}.preview button,.preview select{min-height:44px}}
</style>
<main>
<header><div><p class="eyebrow">Кухня 3D · Персонажи</p><h1>Соседи по квартире</h1></div><p>Десять разных персонажей для одной компании.<br>Посмотрите, как они двигаются, держат вещи и обращаются с оружием.</p></header>
<div class="preview" aria-label="Просмотр анимаций персонажей">
<label>Образ действия<select id="preview-mode"><option value="idle">Покой</option><option value="walk">Прогулка</option><option value="run">Бег</option><option value="phone">Телефон</option><option value="newspaper">Газета</option><option value="pistol">Пистолет</option><option value="rifle">Автомат</option><option value="bolt">Винтовка</option><option value="shotgun">Двустволка</option></select></label>
<button id="preview-primary" class="primary" type="button">Прыгнуть</button><button id="preview-secondary" type="button">Сесть</button><button id="preview-device" type="button">Открыть дверь</button><button id="preview-play" type="button" aria-pressed="false">Оживить</button>
<label><input id="preview-aim" type="checkbox">Прицел</label><label>Взгляд<input id="preview-pitch" type="range" min="-0.8" max="0.8" step="0.05" value="0"></label><label>Поворот головы<input id="preview-yaw" type="range" min="-1.1" max="1.1" step="0.05" value="0"></label>
</div>
<section id="gallery" aria-label="Десять игровых персонажей"><div id="grid"></div></section><p id="status" role="status">Собираем персонажей…</p>
<footer><span><a href="./">Вернуться в квартиру</a> · Настоящие модели из игры</span><span>Просмотр останавливается через 20 секунд и при уходе со страницы</span></footer>
</main>
<script type="module">
try {
const THREE=await import('three');
const {createAvatar,AVATAR_ROSTER}=await import('./js/multiplayer/avatars.js');
const {actionDuration}=await import('./js/multiplayer/action-contract.js');
const names=['Никита','Лёша','Саша','Аня','Сергей','Макс','Катя','Коля','Маша','Илья'];
const details=['Тельняшка · короткая стрижка','Горчичная куртка · капюшон','Комбинезон · бейсболка','Терракотовый свитер · пучок','Синий жилет · очки','Лиловая футболка · шапка','Ветровка · коса и рюкзак','Белый фартук · колпак','Коралловая куртка · каре','Рабочая рубашка · рыжая шапка'];
function initGallery(){
 const gallery=document.querySelector('#gallery'),grid=document.querySelector('#grid');grid.replaceChildren();
 const mode=document.querySelector('#preview-mode'),primary=document.querySelector('#preview-primary'),secondary=document.querySelector('#preview-secondary'),device=document.querySelector('#preview-device'),playButton=document.querySelector('#preview-play'),aim=document.querySelector('#preview-aim'),pitch=document.querySelector('#preview-pitch'),yaw=document.querySelector('#preview-yaw');
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0,0);gallery.append(renderer.domElement);
 const models=AVATAR_ROSTER.map((definition,slot)=>{
  const article=document.createElement('article'),holder=document.createElement('div');holder.className='model';article.append(holder);const label=document.createElement('div');label.className='label';
  const number=document.createElement('span');number.className='number';number.textContent=String(slot+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=definition.label;const detail=document.createElement('span');detail.className='detail';detail.textContent=details[slot];label.append(number,name,detail);article.append(label);grid.append(article);
  const scene=new THREE.Scene(),avatar=createAvatar({slot,name:names[slot],host:slot===0});avatar.root.rotation.y=-0.12;scene.add(avatar.root);scene.add(new THREE.HemisphereLight('#ffffff','#b4aaa0',2.7));const light=new THREE.DirectionalLight('#fff5e4',2.6);light.position.set(-3,5,-4);scene.add(light);
  const stageMaterial=new THREE.MeshStandardMaterial({color:'#dedbd2',roughness:1}),platform=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.018,40),stageMaterial);platform.position.y=-.016;scene.add(platform);
  const seat=new THREE.Mesh(new THREE.CylinderGeometry(.20,.20,.44,18),stageMaterial);seat.position.set(0,.22,.05);seat.visible=false;scene.add(seat);
  const camera=new THREE.OrthographicCamera(-1,1,1.2,-1.2,.1,30);camera.position.set(1.3,1.3,-6);camera.lookAt(0,1,0);return{scene,avatar,camera,holder,platform,seat,stageMaterial,tile:null};
 });
 let clock=1,cue=null,lastShot=null,jumpAt=null,landed=false,seated=false,dropped=false,raf=null,deadline=0,previousFrame=0,disposed=false,width=0,height=0;
 const listeners=[];function on(node,event,callback){node.addEventListener(event,callback);listeners.push(()=>node.removeEventListener(event,callback));}
 const isWeapon=()=>['pistol','rifle','bolt','shotgun'].includes(mode.value),isItem=()=>['phone','newspaper'].includes(mode.value);
 function makeCue(kind,targetId){cue={kind,at:clock,duration:actionDuration(kind,isWeapon()?mode.value:'none'),...(targetId?{targetId}:{})};}
 function controls(){primary.textContent=isWeapon()?'Выстрел':isItem()?(dropped?'Взять':'Положить'):'Прыгнуть';secondary.textContent=isWeapon()?'Перезарядить':isItem()?(mode.value==='phone'?'Экран телефона':'Листать'):(seated?'Встать':'Сесть');secondary.disabled=isItem()&&dropped;aim.disabled=!isWeapon();}
 function layout(){const bounds=gallery.getBoundingClientRect();width=gallery.clientWidth;height=gallery.clientHeight;renderer.setSize(width,height,false);for(const m of models){const r=m.holder.getBoundingClientRect();m.tile={x:r.left-bounds.left,y:height-(r.bottom-bounds.top),w:r.width,h:r.height};m.camera.left=-1.19*r.width/r.height;m.camera.right=1.19*r.width/r.height;m.camera.updateProjectionMatrix();}}
 function state(){const value={time:clock,speed:seated?0:mode.value==='walk'?1.35:mode.value==='run'?3:0,weapon:isWeapon()?mode.value:'none',held:isItem()&&!dropped?mode.value:null,seated,seatY:.45,grounded:true,verticalSpeed:0,aiming:aim.checked&&isWeapon()?1:0,aimPitch:Number(pitch.value),aimYaw:Number(yaw.value),shotAge:lastShot===null?null:clock-lastShot};let height=0;
  if(jumpAt!==null){const t=clock-jumpAt;if(t<.8){const u=Math.max(0,t/.8);height=Math.sin(u*Math.PI)*.36;value.grounded=false;value.verticalSpeed=Math.cos(u*Math.PI)*.36*Math.PI/.8;}else if(!landed){landed=true;cue={kind:'land',at:jumpAt+.8,duration:actionDuration('land')};}}
  if(cue){value.action=cue;value.actionTime=Math.max(0,Math.min(cue.duration,clock-cue.at));value.interaction=cue;if(cue.kind==='reload'&&clock-cue.at<cue.duration){value.reloading=true;value.reloadProgress=(clock-cue.at)/cue.duration;}if(cue.kind==='use'&&cue.targetId==='preview-door')value.interactionTarget=[.16,1.43,-.45];}
  return{value,height};}
 function render(){if(disposed)return;const sample=state();renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const m of models){m.avatar.root.position.y=sample.height;m.avatar.update(sample.value);m.seat.visible=seated||cue?.kind==='stand'&&clock-cue.at<cue.duration;const t=m.tile;renderer.setViewport(t.x,t.y,t.w,t.h);renderer.setScissor(t.x,t.y,t.w,t.h);renderer.render(m.scene,m.camera);}document.querySelector('#status').hidden=true;}
 function stop(){if(raf!==null)cancelAnimationFrame(raf);raf=null;playButton.textContent='Оживить';playButton.setAttribute('aria-pressed','false');}
 function frame(now){raf=null;if(disposed||document.hidden||now>=deadline){stop();return;}clock+=Math.min(.05,Math.max(0,(now-previousFrame)/1000));previousFrame=now;render();raf=requestAnimationFrame(frame);}
 function play(ms=20000){deadline=performance.now()+Math.min(20000,ms);previousFrame=performance.now();playButton.textContent='Пауза';playButton.setAttribute('aria-pressed','true');if(raf===null)raf=requestAnimationFrame(frame);}
 on(mode,'change',()=>{stop();cue=null;lastShot=null;jumpAt=null;seated=false;dropped=false;if(isWeapon())makeCue('draw',mode.value);controls();render();if(isWeapon()||['walk','run'].includes(mode.value))play(isWeapon()?1000:20000);});
 on(primary,'click',()=>{if(isWeapon()){lastShot=clock;makeCue('fire',mode.value);}else if(isItem()){makeCue(dropped?'pickup':'drop',mode.value);dropped=!dropped;}else{seated=false;jumpAt=clock;landed=false;makeCue('jump');}controls();render();play(isWeapon()?1200:1600);});
 on(secondary,'click',()=>{if(isWeapon())makeCue('reload',mode.value);else if(isItem())makeCue(mode.value==='newspaper'?'page':'use',mode.value);else{seated=!seated;makeCue(seated?'sit':'stand');}controls();render();play(isWeapon()?3500:1200);});
 on(device,'click',()=>{makeCue('use','preview-door');render();play(1000);});on(playButton,'click',()=>raf===null?play():stop());
 on(aim,'change',render);on(pitch,'input',render);on(yaw,'input',render);on(window,'resize',()=>{layout();render();});on(document,'visibilitychange',()=>{if(document.hidden)stop();});
 controls();layout();render();
 window.__avatarGallery={models,renderer,render,get playing(){return raf!==null;},dispose(){if(disposed)return;disposed=true;stop();for(const remove of listeners)remove();for(const m of models){m.avatar.dispose();m.platform.geometry.dispose();m.seat.geometry.dispose();m.stageMaterial.dispose();}renderer.dispose();renderer.forceContextLoss();renderer.domElement.remove();}};
}
initGallery();addEventListener('pagehide',()=>window.__avatarGallery?.dispose());addEventListener('pageshow',event=>{if(event.persisted)initGallery();});
}catch(error){const status=document.querySelector('#status');status.hidden=false;status.textContent='Не удалось показать персонажей. Обновите страницу или откройте её в современном браузере.';const retry=document.createElement('button');retry.type='button';retry.textContent='Обновить страницу';retry.style.cssText='display:block;margin-top:12px;min-height:44px;padding:8px 16px;cursor:pointer';retry.onclick=()=>location.reload();status.append(retry);}
</script>
</html>
