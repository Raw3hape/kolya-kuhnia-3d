<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Кабан-шеф: голова кабана в поварском колпаке набекрень. Обводка = те же фигуры толстой тёмной линией под заливкой. -->
  <defs>
    <g id="hat">
      <circle cx="23" cy="15" r="7.5"/><circle cx="32" cy="10.5" r="8.5"/><circle cx="41" cy="15" r="7.5"/>
      <rect x="21" y="15" width="22" height="11" rx="2"/>
    </g>
    <g id="ears">
      <path d="M8 22 L21 30 L13 40 Z"/><path d="M56 22 L43 30 L51 40 Z"/>
    </g>
    <g id="tusks">
      <path d="M20 52 Q15 47 17 41 L23 49 Z"/><path d="M44 52 Q49 47 47 41 L41 49 Z"/>
    </g>
  </defs>
  <g fill="#1c2326" stroke="#1c2326" stroke-width="5" stroke-linejoin="round">
    <use href="#ears"/>
    <ellipse cx="32" cy="41" rx="21" ry="18"/>
    <use href="#tusks"/>
    <use href="#hat" transform="rotate(-14 32 20)"/>
  </g>
  <g fill="#8a5a3c"><use href="#ears"/></g>
  <path d="M10.5 25 L19 30.5 L14 37 Z M53.5 25 L45 30.5 L50 37 Z" fill="#e58f8c"/>
  <ellipse cx="32" cy="41" rx="21" ry="18" fill="#8a5a3c"/>
  <path d="M15 33 Q32 22 49 33" fill="none" stroke="#6b4129" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fffaf0"><use href="#tusks"/></g>
  <g fill="#fff"><use href="#hat" transform="rotate(-14 32 20)"/></g>
  <path d="M22 17.5 H42" stroke="#d9d4cb" stroke-width="2.4" transform="rotate(-14 32 20)"/>
  <!-- глаза: левый хитро прищурен -->
  <path d="M19 37.5 Q22.5 34.5 26 37.5" fill="none" stroke="#1c2326" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="42" cy="36.5" r="3.2" fill="#1c2326"/><circle cx="43" cy="35.5" r="1.1" fill="#fff"/>
  <!-- пятачок -->
  <ellipse cx="32" cy="47.5" rx="11" ry="8" fill="#f2a3a0" stroke="#1c2326" stroke-width="2.6"/>
  <ellipse cx="28" cy="47.5" rx="2" ry="3.2" fill="#1c2326"/><ellipse cx="36" cy="47.5" rx="2" ry="3.2" fill="#1c2326"/>
</svg>
