<style>
  /* Макет: 3D на весь экран, справа панель-«спецификация» как лист чертежа; уже 800 px панель — шторка снизу. */
  :root {
    --ink: #1c2326;          /* текст */
    --muted: #66706f;
    --faint: #9aa2a1;
    --paper: #f4f3ef;        /* фон страницы под сценой */
    --sheet: rgba(250, 249, 246, 0.94);
    --solid: #fbfaf8;        /* непрозрачные всплывашки и «кнопка» сегмента */
    --line: rgba(28, 35, 38, 0.12);
    --line-2: rgba(28, 35, 38, 0.22);
    --hover: rgba(28, 35, 38, 0.05);
    --accent: #0f4352;       /* тёмная бирюза номеров помещений с плана */
    --accent-ink: #ffffff;
    --plan-green: #7fae22;   /* зелёный электрики с плана */
    --wall-swatch: #e8e5df;
    --thumb-bg: #efeeea;     /* фон миниатюр вещей: светлый в обеих темах, белый фон фото растворяется (multiply) */
    --shadow: 0 10px 40px rgba(20, 30, 35, 0.16);
    --shadow-pop: 0 14px 36px rgba(20, 30, 35, 0.2);
    --panel-w: 376px;
    --peek: 52px;            /* видимая часть свёрнутой шторки */
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --f-display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Inter", "Helvetica Neue", Arial, sans-serif;
    --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --ink: #e7ebea; --muted: #9aa5a4; --faint: #6c7675; --paper: #121617; --sheet: rgba(22, 27, 29, 0.93); --solid: #1d2426;
    --line: rgba(231, 235, 234, 0.12); --line-2: rgba(231, 235, 234, 0.24); --hover: rgba(231, 235, 234, 0.06);
    --accent: #7cc4d3; --accent-ink: #0c1a1e; --wall-swatch: #3a3f40; --thumb-bg: #d6d4cf;
    --shadow: 0 10px 40px rgba(0,0,0,0.45); --shadow-pop: 0 14px 36px rgba(0,0,0,0.55); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --ink: #e7ebea; --muted: #9aa5a4; --faint: #6c7675; --paper: #121617; --sheet: rgba(22, 27, 29, 0.93); --solid: #1d2426;
    --line: rgba(231, 235, 234, 0.12); --line-2: rgba(231, 235, 234, 0.24); --hover: rgba(231, 235, 234, 0.06);
    --accent: #7cc4d3; --accent-ink: #0c1a1e; --wall-swatch: #3a3f40; --thumb-bg: #d6d4cf;
    --shadow: 0 10px 40px rgba(0,0,0,0.45); --shadow-pop: 0 14px 36px rgba(0,0,0,0.55); color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }

  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  body.panel-open { --shift: calc((var(--panel-w) + 14px) / 2); }   /* плавающее по центру — в середину свободной от панели части */
  #stage { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  [hidden] { display: none !important; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .title-card { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    background: var(--sheet); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 4px; box-shadow: var(--shadow); max-width: min(360px, calc(100vw - 32px)); }
  .title-card h1 { margin: 0; font: 600 17px/1.2 var(--f-display); letter-spacing: -0.01em; }
  .title-card p { margin: 2px 0 0; font: 12px/1.4 var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
  .title-card .no { display: inline-block; background: var(--accent); color: var(--accent-ink); font: 600 12px/1 var(--f-display); padding: 3px 5px; margin-right: 6px; vertical-align: 2px; }

  #views { position: fixed; left: calc(50% - var(--shift, 0px)); transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; box-sizing: border-box; height: 34px; padding: 2px; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100vw - var(--panel-w) - 60px); overflow-x: auto; scrollbar-width: none;
    transition: left 0.28s var(--ease); }
  #views button { border: 0; background: transparent; color: var(--ink); font: 500 13px/1 var(--f-body); padding: 0 12px; border-radius: 3px; cursor: pointer; white-space: nowrap; }   /* полоса 34 px — как «Прогулка» рядом */
  #views button:hover { background: var(--hover); }
  #views button.on { background: var(--accent); color: var(--accent-ink); }

  /* ---------- панель ---------- */
  #panel { position: fixed; z-index: 6; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: var(--panel-w); display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform 0.3s var(--ease), visibility 0.3s; }
  #panel:not(.open) { transform: translateX(calc(100% + 24px)); visibility: hidden; }
  #sheet-grab { display: none; }
  #panel-toggle { position: fixed; z-index: 6; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: 600 13px/1 var(--f-display);
    padding: 10px 12px; border-radius: 6px; box-shadow: var(--shadow); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #panel-toggle:hover { border-color: var(--line-2); }

  #panel-head { flex: none; position: relative; padding: 12px 12px 0; border-bottom: 1px solid var(--line); }
  .head-row { display: flex; align-items: center; gap: 2px; }
  #variant-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; margin-right: 6px; text-align: left; border: 1px solid var(--line); background: transparent;
    color: var(--ink); border-radius: 5px; padding: 6px 8px 6px 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  #variant-btn:hover, #variant-btn[aria-expanded="true"] { border-color: var(--line-2); background: var(--hover); }
  #variant-btn .v-text { flex: 1; min-width: 0; }
  #variant-btn .cap { display: block; font: 500 10px/1.3 var(--f-data); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  #variant-btn .name { display: block; font: 600 14px/1.3 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #variant-btn .ico { width: 16px; height: 16px; color: var(--muted); transition: transform 0.2s var(--ease); }
  #variant-btn[aria-expanded="true"] .ico { transform: rotate(180deg); }
  .ibtn { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink); border-radius: 5px; cursor: pointer; padding: 0; }
  .ibtn:hover { background: var(--hover); }
  .ibtn:disabled { color: var(--faint); background: none; cursor: default; }
  .ab { display: flex; align-items: center; height: 30px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-left: 2px; }
  .ab button { height: 100%; border: 0; background: transparent; color: var(--ink); font: 600 12.5px/1 var(--f-display); padding: 0 10px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .ab button.on { background: var(--accent); color: var(--accent-ink); }
  .ab .ab-x { padding: 0 6px; color: var(--muted); border-left: 1px solid var(--line); }
  .ab .ab-x .ico { width: 14px; height: 14px; }
  .code-row { margin-top: 8px; }
  #code-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: var(--hover); color: var(--muted); border-radius: 4px;
    padding: 6px 8px; font: 11.5px/1.2 var(--f-data); cursor: pointer; transition: color 0.15s; }
  #code-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  #code-btn .ico { width: 15px; height: 15px; }
  #code-btn:hover { color: var(--ink); }

  #tabs { display: flex; margin: 8px -12px 0; padding: 0 6px; }
  #tabs [role="tab"] { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; padding: 8px 2px 9px;
    border: 0; background: transparent; color: var(--muted); font: 500 11.5px/1 var(--f-body); cursor: pointer; border-radius: 5px 5px 0 0; transition: color 0.15s; }
  #tabs [role="tab"]:hover { color: var(--ink); background: var(--hover); }
  #tabs [role="tab"][aria-selected="true"] { color: var(--ink); }
  #tabs [role="tab"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent);
    transform: scaleX(0); transition: transform 0.2s var(--ease); }
  #tabs [role="tab"][aria-selected="true"]::after { transform: none; }
  #search-row { position: relative; margin: 2px 0 10px; }
  #search-row .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  #mat-search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--hover); color: var(--ink); border-radius: 5px;
    padding: 8px 44px 8px 32px; font: 13px var(--f-body); transition: border-color 0.15s, background 0.15s; }
  #mat-search:focus { background: var(--solid); border-color: var(--line-2); }
  #mat-search::-webkit-search-cancel-button { cursor: pointer; }
  #search-count { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); font: 11px var(--f-data); color: var(--muted); pointer-events: none; }
  #busy-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity 0.2s; }
  #busy-bar::before { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); animation: busy 1.1s ease-in-out infinite; }
  #panel.busy #busy-bar { opacity: 1; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  #panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 18px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .empty { margin: 28px 8px; text-align: center; color: var(--muted); font-size: 13px; }

  /* раздел и строка-слот раскрываются через grid 0fr → 1fr: плавно и без замеров высоты */
  .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.22s var(--ease); }
  .open > .fold { grid-template-rows: 1fr; }
  .fold > .fold-in { min-height: 0; overflow: hidden; margin: 0 -4px; padding: 0 4px; }   /* поля — для рамки фокуса */

  .sec { border-bottom: 1px solid var(--line); }
  .sec:last-of-type { border-bottom: 0; }
  .sec h3 { margin: 0; font: inherit; }
  .sec-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
  .sec-title { font: 600 12px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  .sec-sum { flex: 1; min-width: 0; text-align: right; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity 0.15s; }
  .sec.open .sec-sum { opacity: 0; }
  .sec-head .ico, .slot-head .ico { width: 16px; height: 16px; color: var(--muted); transition: transform 0.22s var(--ease); }
  .sec.open > h3 .ico, .slot.open > .slot-head .ico { transform: rotate(180deg); }
  .sec-body { display: flex; flex-direction: column; gap: 12px; padding: 2px 0 16px; }
  .sec-foot { display: flex; justify-content: flex-end; margin-top: -4px; }
  .reset { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 4px 2px; color: var(--muted); font: 12px var(--f-body); cursor: pointer; border-radius: 4px; }
  .reset:hover { color: var(--ink); }
  .reset .ico { width: 14px; height: 14px; }
  .sec-title { position: relative; }
  .sec.changed .sec-title::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 7px; vertical-align: 2px; border-radius: 50%; background: var(--accent); }
  .flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 18%, transparent); } 100% { background: transparent; } }

  .slot { border: 1px solid var(--line); border-radius: 5px; transition: border-color 0.15s; }
  .slot.open { border-color: var(--line-2); }
  .slot-head { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border: 0; background: transparent;
    color: var(--ink); cursor: pointer; text-align: left; border-radius: 4px; }
  .slot-head:hover { background: var(--hover); }
  .slot-label { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .current { flex: 1; min-width: 0; text-align: right; font-size: 12px; color: var(--ink); opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current small { font-size: 11.5px; color: var(--muted); }
  .slot-body { display: flex; flex-direction: column; gap: 8px; padding: 2px 9px 10px; }
  .slot.locked { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-style: dashed; }
  .locked-text { font-size: 12.5px; color: var(--muted); }
  .mini { position: relative; flex: none; width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--line); overflow: hidden; background: var(--wall-swatch); }
  .mini img, .sw-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.8); }
  .mini img.tinted, .sw-img img.tinted { mix-blend-mode: multiply; }

  .slot-body > .seg button { padding: 7px 4px; }
  .grid-tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mini-sel { flex: 0 1 auto; min-width: 0; max-width: 52%; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 5px; padding: 5px 6px; font: 12px var(--f-body); cursor: pointer; }
  .mini-sel:hover { border-color: var(--line-2); }
  .grid-count { margin-left: auto; flex: none; font: 11px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid-empty { margin: 4px 0; font-size: 12px; color: var(--muted); }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  /* длинный каталог листается внутри слота: шапка, фильтр и соседние зоны остаются под рукой */
  .slot-body .swatches.many { max-height: 316px; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 4px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .sw { position: relative; aspect-ratio: 1; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--wall-swatch); cursor: pointer; overflow: hidden;
    transition: transform 0.12s var(--ease), box-shadow 0.12s; }
  .sw-img { position: absolute; inset: 0; overflow: hidden; }
  .sw-same { position: absolute; right: 4px; bottom: 3px; font: 600 12px/1 var(--f-data); color: #fff; text-shadow: 0 0 3px rgba(0,0,0,0.7); }
  .sw:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14); }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw-none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .sw-price { position: absolute; left: 2px; bottom: 2px; padding: 1px 3px; border-radius: 2px; background: rgba(16, 20, 22, 0.62); color: #fff;
    font: 500 9.5px/1.2 var(--f-data); font-variant-numeric: tabular-nums; pointer-events: none; }
  .sr-hide, .flt-hide { display: none !important; }

  /* карточки реальных вещей (products) */
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 8px; }
  .pc { position: relative; display: flex; min-width: 0; }
  .pc-hit { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 0 8px; border: 1px solid var(--line); border-radius: 5px;
    background: transparent; color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
  .pc-hit:hover { border-color: var(--line-2); background: var(--hover); }
  .pc-hit.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pc-img { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; margin-bottom: 6px; background: var(--thumb-bg); overflow: hidden; color: var(--faint); }
  .pc-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .pc-img .ico { width: 26px; height: 26px; opacity: 0.6; }
  .pc-img:not(.noimg) .ico { visibility: hidden; }
  .pc-img.noimg img { display: none; }
  .pc-name { padding: 0 8px; font: 500 12.5px/1.3 var(--f-body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .pc-meta { padding: 0 8px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.45em; }
  .pc-price { padding: 2px 30px 0 8px; font: 500 12px/1.3 var(--f-data); font-variant-numeric: tabular-nums; }
  .pc-link { position: absolute; right: 4px; bottom: 4px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); }
  .pc-link:hover { color: var(--accent); background: var(--hover); }
  .pc-link .ico { width: 15px; height: 15px; }
  .pc-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  .pc-none { grid-column: 1 / -1; }
  .pc-none .pc-hit { flex-direction: row; align-items: center; gap: 8px; padding: 0 10px; min-height: 36px; }
  .pc-none .pc-name { padding: 0; min-height: 0; color: var(--muted); }
  .pc-none .pc-hit.on .pc-name { color: var(--ink); }
  .pc-none .ico { width: 16px; height: 16px; color: var(--muted); }

  /* контролы */
  .ctl { display: flex; flex-direction: column; gap: 7px; }
  .ctl.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
  .ctl-label { font-size: 13px; color: var(--muted); }
  .ctl.inline > .ctl-label { flex: none; }
  .ctl.inline > .hint { display: none; }
  .ctl:has(> .hint) { flex-wrap: wrap; }
  .seg { display: flex; background: var(--hover); border-radius: 6px; padding: 2px; gap: 2px; min-width: 0; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font: 500 12.5px/1 var(--f-body); padding: 7px 10px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; transition: background 0.15s, box-shadow 0.15s; }
  .seg button:hover { background: var(--hover); }
